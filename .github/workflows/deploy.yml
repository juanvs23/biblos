# CI gate plus automatic deploy to the coltmandev.dev VPS on pushes to master.
name: Deploy

on:
  push:
    branches:
      - master
  workflow_dispatch:

# Serialize deploys; never cancel an in-flight deploy mid-restart.
concurrency:
  group: deploy-vps
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      # E2E tests spawn the built server (dist/index.js): build must precede test.
      - name: Build
        run: npm run build
      - name: Test
        run: npm test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: SSH setup
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          # Secrets are passed through env, not interpolated into the script.
          # '%s\n' tolerates the key both with and without a trailing newline
          # (OpenSSH rejects a key file that lacks one).
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s' "$DEPLOY_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts
      - name: Deploy
        env:
          # The public domain sits behind Cloudflare proxy (no SSH); the
          # runner connects to the direct VPS address held in this secret.
          DEPLOY_SSH_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
        run: ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 -i ~/.ssh/id_ed25519 "root@$DEPLOY_SSH_HOST" 'bash -s' < deploy/remote-deploy.sh
