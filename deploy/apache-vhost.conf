# Biblos MCP server — Apache vhost for biblos.coltmandev.dev (task 9.2).
#
# Install:
#   sudo cp deploy/apache-vhost.conf /etc/apache2/sites-available/biblos.conf
#   sudo a2enmod proxy proxy_http
#   sudo a2ensite biblos
#   sudo apachectl configtest
#   sudo systemctl reload apache2
#
# The upstream is LOOPBACK ONLY: the MCP server binds 127.0.0.1:8199 and must
# never be exposed directly to the network (design: Apache proxy -> systemd unit).
#
# TLS (task 9.5, VPS side): after the Cloudflare A record points here, run
#   sudo certbot --apache -d biblos.coltmandev.dev
# which adds the :443 VirtualHost and the HTTP->HTTPS redirect automatically.

<VirtualHost *:80>
    ServerName biblos.coltmandev.dev
    ServerAdmin webmaster@coltmandev.dev

    ProxyPreserveHost On
    ProxyRequests Off
    ProxyPass / http://127.0.0.1:8199/
    ProxyPassReverse / http://127.0.0.1:8199/

    ErrorLog ${APACHE_LOG_DIR}/biblos-error.log
    CustomLog ${APACHE_LOG_DIR}/biblos-access.log combined
</VirtualHost>
